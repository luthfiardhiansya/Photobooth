<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Frame - Timeless Booth</title>
    <style>
        :root {
            --bg: #f8fbff;
            --surface: #ffffff;
            --ink: #182033;
            --muted: #6f7b90;
            --line: #dfe8f7;
            --blue: #4da3ff;
            --coral: #ff6b6b;
            --yellow: #ffd166;
            --mint: #52d6a3;
            --shadow: 0 22px 60px rgba(57, 89, 135, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 12% 8%, rgba(77, 163, 255, 0.2), transparent 26%),
                radial-gradient(circle at 90% 12%, rgba(255, 209, 102, 0.28), transparent 24%),
                radial-gradient(circle at 84% 88%, rgba(82, 214, 163, 0.22), transparent 28%),
                var(--bg);
            background-size: 120% 120%;
            animation: backgroundDrift 14s ease-in-out infinite alternate;
            overflow-x: hidden;
        }

        .page-shell {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 24px 0 64px;
        }

        .topbar {
            position: sticky;
            top: 14px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 12px;
            border: 1px solid rgba(223, 232, 247, 0.95);
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.88);
            box-shadow: 0 18px 48px rgba(57, 89, 135, 0.12);
            backdrop-filter: blur(18px);
            animation: fadeDown 0.5s cubic-bezier(0.2, 0.95, 0.25, 1) both;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .brand-mark {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            flex: 0 0 auto;
            background: linear-gradient(135deg, var(--blue), var(--mint));
            position: relative;
            box-shadow: 0 10px 24px rgba(77, 163, 255, 0.22);
            animation: markPulse 2.7s ease-in-out infinite;
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            inset: 9px;
            border: 4px solid #fff;
            border-radius: 50%;
        }

        .brand strong {
            display: block;
            font-size: 1rem;
            line-height: 1;
        }

        .brand span {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 800;
        }

        .tab-container {
            display: flex;
            gap: 8px;
            flex: 0 0 auto;
        }

        button {
            font: inherit;
        }

        .tab-btn {
            min-height: 42px;
            border-radius: 999px;
            border: 1px solid var(--line);
            padding: 0 16px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            color: var(--ink);
            background: #f4f8ff;
            font-size: 0.78rem;
            font-weight: 950;
            text-transform: uppercase;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, color 0.2s ease;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
        }

        .tab-btn.active {
            color: #fff;
            border-color: transparent;
            background: linear-gradient(135deg, var(--blue), #7c65ff);
            box-shadow: 0 12px 24px rgba(77, 163, 255, 0.26);
        }

        .tab-btn.active::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 0 32%, rgba(255, 255, 255, 0.38) 48%, transparent 64% 100%);
            transform: translateX(-120%);
            animation: shineSweep 3.2s ease-in-out infinite;
        }

        .hero {
            display: grid;
            grid-template-columns: minmax(280px, 1fr) minmax(240px, 340px);
            align-items: end;
            gap: 24px;
            margin: 46px 0 22px;
            animation: fadeUp 0.55s cubic-bezier(0.2, 0.95, 0.25, 1) 0.08s both;
        }

        h1 {
            font-size: clamp(2.8rem, 8vw, 6.8rem);
            line-height: 0.9;
            letter-spacing: 0;
            text-transform: uppercase;
        }

        .hero-copy {
            margin-top: 14px;
            color: var(--muted);
            font-size: clamp(1rem, 2vw, 1.15rem);
            font-weight: 750;
            line-height: 1.5;
            max-width: 620px;
        }

        .mini-panel {
            padding: 16px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.86);
            border: 1px solid var(--line);
            box-shadow: 0 18px 48px rgba(57, 89, 135, 0.12);
            color: var(--muted);
            font-weight: 850;
            line-height: 1.45;
            animation: panelFloat 4.8s ease-in-out infinite;
        }

        .layout-section {
            display: none;
            animation: fadeUp 0.5s cubic-bezier(0.2, 0.95, 0.25, 1) both;
        }

        .layout-section.active {
            display: block;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 18px;
            align-items: start;
        }

        .frame-card {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 16px 42px rgba(57, 89, 135, 0.12);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            position: relative;
            overflow: hidden;
            animation: cardIn 0.54s cubic-bezier(0.2, 0.95, 0.25, 1) backwards;
        }

        .frame-card:nth-child(2) {
            animation-delay: 0.04s;
        }

        .frame-card:nth-child(3) {
            animation-delay: 0.08s;
        }

        .frame-card:nth-child(4) {
            animation-delay: 0.12s;
        }

        .frame-card:nth-child(5) {
            animation-delay: 0.16s;
        }

        .frame-card:nth-child(6) {
            animation-delay: 0.2s;
        }

        .frame-card:nth-child(7) {
            animation-delay: 0.24s;
        }

        .frame-card:nth-child(8) {
            animation-delay: 0.28s;
        }

        .frame-card:nth-child(9) {
            animation-delay: 0.32s;
        }

        .frame-card:nth-child(10) {
            animation-delay: 0.36s;
        }

        .frame-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(77, 163, 255, 0.1), rgba(255, 209, 102, 0.14));
            opacity: 0;
            transition: opacity 0.25s ease;
            pointer-events: none;
        }

        .frame-card:hover {
            transform: translateY(-8px) rotate(-1deg);
            border-color: rgba(77, 163, 255, 0.5);
            box-shadow: 0 26px 60px rgba(57, 89, 135, 0.18);
        }

        .frame-card:hover::before,
        .frame-card.selected::before {
            opacity: 1;
        }

        .frame-preview {
            height: 360px;
            border-radius: 18px;
            background: #f4f8ff;
            display: grid;
            place-items: center;
            overflow: hidden;
            position: relative;
        }

        .frame-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
            filter: saturate(0.9);
            transition: transform 0.25s ease, filter 0.25s ease;
        }

        .frame-card:hover .frame-preview img,
        .frame-card.selected .frame-preview img {
            transform: scale(1.035);
            filter: saturate(1.1);
        }

        .frame-card p {
            position: relative;
            margin-top: 12px;
            color: var(--ink);
            font-size: 0.86rem;
            font-weight: 1000;
            text-align: center;
            text-transform: uppercase;
        }

        .selected {
            border-color: transparent;
            background: #fff;
            transform: translateY(-6px);
            box-shadow: 0 28px 64px rgba(77, 163, 255, 0.22);
        }

        .selected::after {
            content: "Dipilih";
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 2;
            padding: 7px 10px;
            border-radius: 999px;
            color: #fff;
            background: linear-gradient(135deg, var(--coral), var(--yellow));
            font-size: 0.7rem;
            font-weight: 1000;
            text-transform: uppercase;
            box-shadow: 0 12px 24px rgba(255, 107, 107, 0.2);
        }

        @keyframes backgroundDrift {
            from {
                background-position: 0% 0%;
            }

            to {
                background-position: 8% 12%;
            }
        }

        @keyframes fadeDown {
            from {
                opacity: 0;
                transform: translateY(-14px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(22px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes markPulse {
            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08) rotate(-3deg);
            }
        }

        @keyframes shineSweep {
            0%,
            58% {
                transform: translateX(-120%);
            }

            100% {
                transform: translateX(120%);
            }
        }

        @keyframes panelFloat {
            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        @media (max-width: 760px) {
            .page-shell {
                width: calc(100% - 24px);
                padding-top: 12px;
            }

            .topbar {
                align-items: stretch;
                flex-direction: column;
            }

            .tab-container {
                width: 100%;
            }

            .tab-btn {
                width: 100%;
            }

            .hero {
                grid-template-columns: 1fr;
                margin-top: 32px;
                gap: 16px;
            }

            h1 {
                font-size: clamp(2.8rem, 15vw, 4.6rem);
            }

            .grid-container {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 12px;
            }

            .frame-card {
                border-radius: 18px;
                padding: 8px;
            }

            .frame-preview {
                height: 260px;
                border-radius: 14px;
            }

            .frame-card p {
                font-size: 0.68rem;
            }
        }

        @media (max-width: 430px) {
            .frame-preview {
                height: 215px;
            }

            .mini-panel {
                font-size: 0.92rem;
            }
        }
    </style>
</head>

<body>
    <main class="page-shell">
        <header class="topbar">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <div>
                    <strong>Timeless Booth</strong>
                    <span>Pilih frame favoritmu</span>
                </div>
            </div>
            <div class="tab-container">
            </div>
        </header>

        <section class="hero" aria-label="Pilih frame">
            <div>
                <h1>Pilih<br>Frame</h1>
                <p class="hero-copy">Setiap frame langsung tersimpan sebagai pilihan sebelum masuk ke kamera. Pilih yang paling cocok, lalu lanjut ke sesi foto.</p>
            </div>
        </section>

        <section id="strip" class="layout-section active">
            <div class="grid-container">
                <div class="frame-card" onclick="selectLayout('layoutA', this)">
                    <div class="frame-preview"><img src="frames/1(2).png" alt="Frame Snoopy"></div>
                    <p>Snoopy</p>
                </div>
                <div class="frame-card" onclick="selectLayout('layoutB', this)">
                    <div class="frame-preview"><img src="frames/2.png" alt="Frame White"></div>
                    <p>White</p>
                </div>
                <div class="frame-card" onclick="selectLayout('layoutC', this)">
                    <div class="frame-preview"><img src="frames/3.png" alt="Frame Cat N Fish"></div>
                    <p>Cat N Fish</p>
                </div>
                <div class="frame-card" onclick="selectLayout('layoutD', this)">
                    <div class="frame-preview"><img src="frames/4.png" alt="Frame Everything You Are"></div>
                    <p>Everything You Are</p>
                </div>
                <div class="frame-card" onclick="selectLayout('layoutE', this)">
                    <div class="frame-preview"><img src="frames/5.png" alt="Frame The Panturas"></div>
                    <p>The Panturas</p>
                </div>
                <div class="frame-card" onclick="selectLayout('layoutF', this)">
                    <div class="frame-preview"><img src="frames/6.png" alt="Frame Circus"></div>
                    <p>Circus</p>
                </div>
                <div class="frame-card" onclick="selectLayout('layoutG', this)">
                    <div class="frame-preview"><img src="frames/7.png" alt="Frame Windows"></div>
                    <p>Windows</p>
                </div>
                <div class="frame-card" onclick="selectLayout('layoutH', this)">
                    <div class="frame-preview"><img src="frames/8.png" alt="Frame Wave To Earth"></div>
                    <p>Wave To Earth</p>
                </div>
                <div class="frame-card" onclick="selectLayout('layoutI', this)">
                    <div class="frame-preview"><img src="frames/9.png" alt="Frame Notebooks"></div>
                    <p>Notebooks</p>
                </div>
                <div class="frame-card" onclick="selectLayout('layoutJ', this)">
                    <div class="frame-preview"><img src="frames/10.png" alt="Frame Teddy Stars"></div>
                    <p>Teddy Stars</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        function switchTab(tabId, btn) {
            document.querySelectorAll('.layout-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        function selectLayout(layoutName, element) {
            localStorage.setItem('selectedLayout', layoutName);

            document.querySelectorAll('.frame-card').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');

            if (navigator.vibrate) navigator.vibrate(40);

            setTimeout(() => {
                window.location.href = 'camera.html';
            }, 500);
        }
    </script>
</body>

</html>
